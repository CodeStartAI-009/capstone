[pytest]
testpaths = tests
pythonpath = .
markers =
    browser: real headless-Chrome tests (skipped when Chrome is not installed)
filterwarnings =
    # numpy 2.0.x + Apple Accelerate emit spurious matmul warnings on macOS;
    # verified harmless in docs/model_evaluation.md ("Environment")
    ignore:.*encountered in matmul:RuntimeWarning
    # urllib3 (imported by tldextract via requests) warns that macOS Python 3.9 uses LibreSSL; no HTTPS
    # requests are made by tldextract here (offline PSL snapshot), so this does not affect the application.
    ignore:urllib3 v2 only supports OpenSSL
